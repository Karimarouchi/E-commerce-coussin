# docker compose up -d --build

services:
  postgres:
    image: postgres:16
    container_name: coussin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: coussin_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-ecommerce_jwt_secret_key_change_in_production_min_32chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://187.127.94.149:3001,http://187.127.94.149:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-Admin@Antigoneagency.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontoffice:
    build:
      context: ./Frontend/frontoffice
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://187.127.94.149:8080/api/v1}
        VITE_BACKOFFICE_URL: ${VITE_BACKOFFICE_URL:-http://187.127.94.149:3000}
    container_name: coussin_frontoffice
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

  backoffice:
    build:
      context: ./Frontend/backoffice
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://187.127.94.149:8080/api/v1}
        VITE_FRONTOFFICE_URL: ${VITE_FRONTOFFICE_URL:-http://187.127.94.149:3001}
    container_name: coussin_backoffice
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
